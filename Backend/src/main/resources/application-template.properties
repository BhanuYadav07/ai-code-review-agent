
spring.datasource.url=jdbc:mysql://localhost:3306/codereview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password= MYSQL PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

